name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/feed.json"
      - "public/images/**"
      - "public/last-refresh.txt"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check syntax and configuration
        run: npm run check

      - name: Test against a mock Instagram API
        run: npm test
