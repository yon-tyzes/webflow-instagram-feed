name: Workflow problem
description: The Update feed workflow fails, or the feed stops updating.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check [Troubleshooting](../blob/main/docs/troubleshooting.md) first. **Never paste a token**, even an expired one.
  - type: textarea
    id: error
    attributes:
      label: Error from the workflow log
      description: Copy the red error line and the few lines above it.
      render: text
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which step failed?
      options:
        - Refresh token
        - Fetch posts
        - Commit changes
        - Publishing to GitHub Pages
        - Not sure
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
  - type: textarea
    id: config
    attributes:
      label: Your feed.config.json
      description: Post links are fine to share if your account is public.
      render: json
