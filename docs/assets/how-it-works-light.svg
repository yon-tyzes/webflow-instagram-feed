<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">How the feed works</title>
  <desc id="desc">A GitHub Action reads posts from Instagram every 6 hours, using a token stored as a repository secret and the featured posts listed in feed.config.json. It downloads the images and publishes feed.json, the images, and ig-feed.js to GitHub Pages. Your website loads ig-feed.js, which fills the cards you designed. On Mondays the Action also renews the token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B6E4F"/></marker>
  </defs>
  <rect width="960" height="330" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1F2328">
    <rect x="10" y="50" width="190" height="130" rx="8" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="105" y="84" font-size="16" font-weight="600" text-anchor="middle">Instagram</text>
    <text x="105" y="112" font-size="13" text-anchor="middle" fill="#59636E">Your Business or</text>
    <text x="105" y="132" font-size="13" text-anchor="middle" fill="#59636E">Creator account</text>
    <rect x="260" y="50" width="190" height="130" rx="8" fill="none" stroke="#0B6E4F" stroke-width="2"/>
    <text x="355" y="84" font-size="16" font-weight="600" text-anchor="middle">GitHub Action</text>
    <text x="355" y="112" font-size="13" text-anchor="middle" fill="#59636E">Every 6 hours: fetch posts,</text>
    <text x="355" y="132" font-size="13" text-anchor="middle" fill="#59636E">download images.</text>
    <text x="355" y="152" font-size="13" text-anchor="middle" fill="#59636E">Mondays: renew the token.</text>
    <rect x="510" y="50" width="190" height="130" rx="8" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="605" y="84" font-size="16" font-weight="600" text-anchor="middle">GitHub Pages</text>
    <text x="605" y="112" font-size="13" text-anchor="middle" fill="#59636E">feed.json, images,</text>
    <text x="605" y="132" font-size="13" text-anchor="middle" fill="#59636E">and ig-feed.js at a</text>
    <text x="605" y="152" font-size="13" text-anchor="middle" fill="#59636E">public address</text>
    <rect x="760" y="50" width="190" height="130" rx="8" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="855" y="84" font-size="16" font-weight="600" text-anchor="middle">Your website</text>
    <text x="855" y="112" font-size="13" text-anchor="middle" fill="#59636E">Cards you design,</text>
    <text x="855" y="132" font-size="13" text-anchor="middle" fill="#59636E">filled in by ig-feed.js</text>
    <line x1="204" y1="115.0" x2="256" y2="115.0" stroke="#1F2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230.0" y="107.0" font-size="12" text-anchor="middle" fill="#59636E">posts</text>
    <line x1="454" y1="115.0" x2="506" y2="115.0" stroke="#1F2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="480.0" y="107.0" font-size="12" text-anchor="middle" fill="#59636E">publish</text>
    <line x1="704" y1="115.0" x2="756" y2="115.0" stroke="#1F2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="730.0" y="107.0" font-size="12" text-anchor="middle" fill="#59636E">loads</text>
    <rect x="226" y="240" width="126" height="58" rx="6" fill="none" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="289.0" y="263" font-size="13" font-weight="600" text-anchor="middle">feed.config.json</text>
    <text x="289.0" y="283" font-size="12" text-anchor="middle" fill="#59636E">Featured posts</text>
    <line x1="289.0" y1="238" x2="289.0" y2="184" stroke="#0B6E4F" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
    <rect x="374" y="240" width="108" height="58" rx="6" fill="none" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="428.0" y="263" font-size="13" font-weight="600" text-anchor="middle">Repo secret</text>
    <text x="428.0" y="283" font-size="12" text-anchor="middle" fill="#59636E">Instagram token</text>
    <line x1="428.0" y1="238" x2="428.0" y2="184" stroke="#0B6E4F" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  </g>
</svg>
